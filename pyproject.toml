[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "assurance-gaps-ai-perception"
version = "1.0.0"
description = "Assurance Gaps in an Integrated Safety and Cybersecurity Case for an AI-Based Perception Component in Highly Automated Driving"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Milin Patel", email = "milin.patel@hs-kempten.de"},
    {name = "Rolf Jung", email = "rolf.jung@hs-kempten.de"},
]
keywords = [
    "safety-assurance",
    "goal-structuring-notation",
    "highly-automated-driving",
    "cybersecurity",
    "ISO-PAS-8800",
    "AI-perception",
    "assurance-gap",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.9",
]
# torch is deliberately not a core dependency: it serves src/perception/,
# which backs no number in either paper, and it dominates install time for a
# reviewer who only wants to regenerate the papers' artefacts. The perception
# modules guard their torch imports and fall back to numpy.
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
    "graphviz>=0.20",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "tabulate>=0.9",
    "jsonschema>=4.17",
]

[project.optional-dependencies]
perception = [
    "torch>=2.0",
    "open3d>=0.17",
    "spconv-cu118>=2.3",
    "numba>=0.57",
]
carla = [
    "carla>=0.9.14",
]
notebooks = [
    "nbclient>=0.8",
    "nbformat>=5.9",
    "ipykernel>=6.25",
]
dev = [
    "pytest>=7.3",
    "pytest-cov>=4.1",
    "black>=23.3",
    "ruff>=0.0.270",
]

[project.scripts]
run-gsn-analysis = "src.analysis.run_analysis:main"
run-ensemble-eval = "src.evaluation.run_evaluation:main"
generate-gsn-diagram = "src.visualization.gsn_renderer:main"
generate-all-results = "src.results.generate_all:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py39"
