# CI: the suite must pass, and every committed generated artefact must match
# what the code generates today. A red "verify-refs" means a source changed
# without its references; fix the cause, never edit a reference by hand.
name: ci

on:
  push:
  pull_request:

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install from the lockfile
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -e . --no-deps

      - name: Test
        run: python -m pytest tests/ -q --tb=short

      - name: Verify committed references against regeneration
        run: make verify-refs
